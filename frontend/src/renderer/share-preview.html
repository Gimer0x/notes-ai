<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Toast preview</title>
    <link rel="stylesheet" href="./shell.css" />
    <style>
      html, body, #app { height: 100%; }
      .content { height: 420px; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar"></aside>
      <section class="main">
        <header class="topbar">
          <div class="topbar-title"><h1>Job Interview Slalom</h1></div>
          <div class="top-actions"><button type="button" class="primary new-note">+ New note</button></div>
        </header>
        <div class="content">
          <div class="note-meta">
            <p class="note-when">Yesterday</p>
            <button type="button" class="text-btn" id="showTranscript">Transcript</button>
            <button type="button" class="icon-btn" id="shareSummary">↗</button>
            <button type="button" class="icon-btn" id="copySummary">⧉</button>
          </div>
          <div class="toast show" id="toast" style="transition:none">Summary sent</div>
          <div id="view" style="height:800px"></div>
        </div>
      </section>
    </div>
  </body>
</html>

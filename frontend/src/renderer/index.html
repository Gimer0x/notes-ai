<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Pith Capture Spike</title>
    <style>
      :root {
        --page: #f7f4ee;
        --ink: #1c1c19;
        --cta: #5f6f4a;
        --muted: #5c5c56;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 650;
        margin: 0 0 12px;
      }
      p,
      label {
        color: var(--muted);
        line-height: 1.45;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
        align-items: center;
      }
      button,
      select {
        font: inherit;
        border-radius: 8px;
        border: 1px solid #d4d0c8;
        padding: 8px 14px;
        background: #fff;
        color: var(--ink);
      }
      button.primary {
        background: var(--cta);
        color: #fff;
        border-color: var(--cta);
      }
      button:disabled {
        opacity: 0.45;
      }
      #status {
        font-weight: 600;
        color: var(--ink);
      }
      #transcript {
        white-space: pre-wrap;
        background: #fff;
        border: 1px solid #e6e1d6;
        border-radius: 10px;
        padding: 16px;
        min-height: 160px;
      }
      #error {
        color: #8b2e2e;
      }
      [hidden] {
        display: none !important;
      }
      .level-pill {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin: 4px 0 12px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(36, 36, 36, 0.92);
        border: 1px solid rgba(220, 220, 220, 0.22);
        color: #f4f4f4;
      }
      .level-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .level-bars {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 22px;
      }
      .level-bars .bar {
        width: 4px;
        border-radius: 99px;
        background: #32d74b;
      }
      .level-bars .bar:nth-child(1) {
        height: 8px;
      }
      .level-bars .bar:nth-child(2) {
        height: 14px;
      }
      .level-bars .bar:nth-child(3) {
        height: 10px;
      }
      .level-label {
        font-size: 0.72rem;
        letter-spacing: 0.02em;
        color: rgba(244, 244, 244, 0.72);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <div class="row">
        <label for="lang" id="languageLabel"></label>
        <select id="lang">
          <option value="en"></option>
          <option value="es"></option>
        </select>
      </div>
      <p id="permissionHint"></p>
      <p id="grantAgain"></p>
      <div class="row">
        <button class="primary" id="start"></button>
        <button id="pause"></button>
        <button id="resume"></button>
        <button id="stop"></button>
        <button id="cancel"></button>
        <button id="resend"></button>
      </div>
      <p id="status"></p>
      <div
        id="levelPill"
        class="level-pill"
        role="meter"
        aria-valuemin="0"
        aria-valuemax="1"
      >
        <div class="level-group">
          <span class="level-bars" id="micBars" data-rest="8,14,10">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </span>
          <span class="level-label" id="micLevelLabel"></span>
        </div>
        <div class="level-group">
          <span class="level-bars" id="sysBars" data-rest="8,14,10">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </span>
          <span class="level-label" id="sysLevelLabel"></span>
        </div>
      </div>
      <p id="systemAudio"></p>
      <p id="duration"></p>
      <p id="error"></p>
      <h2 id="transcriptLabel"></h2>
      <div id="transcript"></div>
    </main>
    <script src="./debug.js"></script>
  </body>
</html>
